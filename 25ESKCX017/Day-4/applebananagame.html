<!DOCTYPE html>
<html lang="en">
<head>
<title>Fruit Game</title>
 <link rel="stylesheet" href="style.css">

</head>
<body>
<h1>Fruit Counter Game</h1>
<div class="score-board">
    🍎 Apple Score:
    <span id="apple-score">0</span>
    🍌 Banana Score:
    <span id="banana-score">0</span>
    ⏱ Time:
    <span id="timer">60</span>
</div>
<button id="game-button" onclick="gameButton()">
    Start Game
</button>
<div id="result"></div>
<div id="game-area">
    <div id="apple" class="fruit">
        🍎
    </div>
    <div id="banana" class="fruit">
        🍌
        
    </div>
</div>


  

   
  <script src="script.js"></script>
  
</body>
</html>
