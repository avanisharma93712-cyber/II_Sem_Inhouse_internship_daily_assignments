<DOCTYPE html>


    <head>
<meta charset="UTF=8 /">
<meta name ="viewport" content="width=device-width" ,intial-scale=2.0>
<title>Registeration</title> 
<link rel="stylesheet" href="style.css">





</head>
<body class="background">
    <center>


        
    <form >
        
     <h1>Registeration Form</h1>

       <label>
        Full Name
        <br>
        <input type ="text" id="txtName" required
        placeholder="Enter ull name" class="rounded" />
        </label>
        <br>
        <label>
        Email Address
        <br>
        <input type ="email" id="txtEmail" required
        placeholder="Enter email address"  class="rounded" />
        </label>
        <br>
        <label>
        Phone Number
        <input type ="text" id="txtPhone" required
        placeholder="enter your Phone no" class="rounded" />
        </label>
        <label for="dtDOB">DOB</label>
        <input type ="date" id="dtDOB" name="dtDOB"  />
        <br>
        <label>
         Gender
         <br>
        <input type ="radio" id="chkmale" name="gender" checked />
        <label for="chkmale">male</label>
        
        <input type ="radio" id="chkfemale" name="gender"  />
        <label for="chkfemale">female</label>
        
        <input type ="radio" id="chktransgender" name="gender"  />
        <label for="chktransgender">transgender</label>
        
        <input type ="radio" id="chkother" name="gender"  />
        <label for="chkother">prefer not to say</label>
        <br>
        <label>
        Address
        <br>
        <input type="text" id="txtAddress" required
        placeholder="Enter street address" class="rounded" />
        <br>
        <input type="text" id="txtAddress" required
        placeholder="Enter street address line 2" class="rounded" />
        </label>
        <br>
        
        <br>

         <label >
        <input type ="text" id="txtCountry" required
        placeholder="Country" class="rounded"/>
        </label>
        <label >
        <input type ="text" id="txtCity" required 
        placeholder="Enter your city" class="rounded"/>
        </label>
        <br>
        <label >
        <input type ="text" id="txtRegion" required 
        placeholder="Enter your region" class="rounded"/>
        </label>
        <label >
        <input type ="password" id="pwdPassword" required
        placeholder="Enter code" class="rounded"/>
        </label>
        <br><br>
         <input type="Submit" id="btnSubmit" class="rounded"/>
        
        
        
    </form>
</center>
</body>
